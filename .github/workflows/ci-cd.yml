name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Black (Code Formatting Check)
      run: black --check --diff .
      
    - name: Run Flake8 (Linting)
      run: flake8 . --count --show-source --statistics
      
    - name: Run isort (Import Sorting Check)
      run: isort --check-only --diff .
      
    - name: Run Pylint
      run: pylint **/*.py --exit-zero
      
    - name: Run Tests
      run: |
        pytest --verbose --cov=. --cov-report=xml --cov-report=html
        
    - name: Upload Coverage Reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Run Bandit Security Scan
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true
        
    - name: Upload Bandit Report
      uses: actions/upload-artifact@v3
      with:
        name: bandit-security-report
        path: bandit-report.json

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build Docker Image
      run: |
        docker build -t ecotravel:latest .
        
    - name: Test Docker Image
      run: |
        docker run -d -p 5000:5000 --name ecotravel-test ecotravel:latest
        sleep 10
        curl -f http://localhost:5000/api/health || exit 1
        docker stop ecotravel-test
        docker rm ecotravel-test
        
